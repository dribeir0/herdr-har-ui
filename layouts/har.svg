  <rect x="0" y="0" width="84" height="200" fill="#1d2027"/>
  <g fill="#262a33" stroke="#3a3f4b"><rect x="6" y="22" width="72" height="30" rx="4"/><rect x="6" y="56" width="72" height="30" rx="4"/><rect x="6" y="90" width="72" height="16" rx="4"/></g>
  <circle cx="13" cy="30" r="2.5" fill="#e5a50a"/><circle cx="13" cy="64" r="2.5" fill="#62a0ea"/>
  <g fill="#57e389"><rect x="10" y="44" width="10" height="3" rx="1"/><rect x="22" y="44" width="10" height="3" rx="1"/><rect x="34" y="44" width="10" height="3" rx="1"/><rect x="10" y="78" width="10" height="3" rx="1"/></g>
  <rect x="46" y="44" width="10" height="3" rx="1" fill="#f66151"/>
  <!-- tab row: tabs on the left, Mission Control | Files | Changes on the right -->
  <rect x="84" y="0" width="236" height="14" fill="#1d2027"/>
  <g fill="#262a33"><rect x="90" y="3" width="26" height="8" rx="2"/><rect x="119" y="3" width="22" height="8" rx="2"/></g>
  <rect x="231" y="3" width="30" height="8" rx="2" fill="#3a3f4b"/>
  <g fill="#262a33"><rect x="264" y="3" width="18" height="8" rx="2"/><rect x="285" y="3" width="26" height="8" rx="2"/></g>
  <!-- terminal -->
  <rect x="90" y="20" width="134" height="166" rx="6" fill="#0f1115" stroke="#3a3f4b"/>
  <g fill="#3a3f4b"><rect x="98" y="32" width="80" height="4"/><rect x="98" y="42" width="110" height="4"/><rect x="98" y="52" width="60" height="4"/></g>
  <!-- right panel: Mission Control (the HAR panel) -->
  <rect x="230" y="20" width="84" height="166" rx="6" fill="#0f1115" stroke="#3a3f4b"/>
  <g fill="#57e389"><rect x="250" y="60" width="50" height="4" rx="2"/><rect x="250" y="70" width="20" height="4" rx="2"/><rect x="250" y="80" width="40" height="4" rx="2"/></g>
  <rect x="250" y="90" width="30" height="4" rx="2" fill="#62a0ea"/>
  <rect x="0" y="190" width="320" height="10" fill="#1d2027"/>
